services:
  - type: web
    name: science-game-auth
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 60

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: ADMIN_PASSWORD
        sync: false

      - key: SECRET_KEY
        generateValue: true