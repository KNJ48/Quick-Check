<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
科学技術部 ゲーム管理システム
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>

<!-- CSRF認証 -->
<meta
    name="csrf-token"
    content="{{ csrf }}"
>

<!-- QRコード生成ライブラリ -->
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    defer
></script>

<!-- 管理画面JavaScript -->
<script
    src="{{ url_for('static', filename='js/admin.js') }}"
    defer
></script>

</head>

<body>

<!-- =====================================
     ヘッダー
===================================== -->

<header class="header">

    <div>

        <h1>
            科学技術部
        </h1>

        <p>
            ゲーム発表会 管理システム
        </p>

    </div>

    <div class="header-actions">

        <span id="connectionStatus">
            接続確認中...
        </span>

        <button
            id="logoutButton"
            type="button"
        >
            ログアウト
        </button>

    </div>

</header>


<!-- =====================================
     管理画面
===================================== -->

<main class="admin-layout">


    <!-- =================================
         受付設定
    ================================= -->

    <section class="control-panel">

        <div class="panel-title">
            受付管理
        </div>

        <label for="endTime">
            昼休み終了時刻（日本時間）
        </label>

        <input
            type="time"
            id="endTime"
            value="13:10"
        >

        <div class="button-row">

            <button
                id="startButton"
                class="primary-button"
                type="button"
            >
                受付開始
            </button>

            <button
                id="stopButton"
                class="danger-button"
                type="button"
            >
                受付終了
            </button>

        </div>


        <!-- 現在の設定 -->

        <div class="info-box">

            <div>
                受付状態：
                <strong id="statusText">
                    読み込み中...
                </strong>
            </div>

            <div>
                受付PC：
                <strong id="receptionConnection">
                    確認中...
                </strong>
            </div>

            <div>
                現在プレイ中：
                <strong id="playingCount">
                    0
                </strong>
                人
            </div>

            <div>
                終了時刻：
                <strong id="deadlineText">
                    読み込み中...
                </strong>
            </div>

        </div>


        <!-- 管理者ゲーム -->

        <a
            href="/admin/game"
            target="_blank"
            rel="noopener noreferrer"
            class="admin-game-button"
        >
            管理者としてゲームを開く
        </a>

    </section>


    <!-- =================================
         プレイヤー管理
    ================================= -->

    <section class="players-panel">

        <div class="players-header">

            <h2>
                プレイヤー管理
            </h2>

            <button
                id="revokeAllButton"
                class="danger-button"
                type="button"
            >
                全員停止
            </button>

        </div>

        <div id="playersList">

            <p class="empty-message">
                サーバーから取得しています...
            </p>

        </div>

    </section>


    <!-- =================================
         QRコード確認パネル
    ================================= -->

    <section class="qr-panel">

        <div class="panel-title">
            現在の受付QRコード
        </div>

        <div
            id="receptionStatus"
            class="status-badge"
        >
            接続確認中...
        </div>

        <h2 id="qrPlayer">
            PLAYER ---
        </h2>


        <!-- QRコード -->

        <div class="qr-box">

            <div id="qrcode"></div>

            <div id="qrPlaceholder">
                QRコードを取得しています...
            </div>

        </div>


        <!-- 有効期限 -->

        <div class="qr-timer">

            QRコード残り有効時間

            <strong id="qrRemaining">
                --:--
            </strong>

        </div>


        <p class="qr-description">

            現在、受付PCに表示されている
            QRコードを確認できます。

            <br><br>

            QRコードが使用されると、
            自動的に次のQRコードへ更新されます。

        </p>

    </section>

</main>

</body>
</html>
