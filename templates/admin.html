<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>科学技術部 ゲーム管理</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
defer>
</script>

<script>
window.ADMIN_CSRF = {{ csrf | tojson }};
</script>

<script
src="{{ url_for('static', filename='js/admin.js') }}"
defer>
</script>

</head>

<body>

<header class="header">

<div>
<h1>科学技術部</h1>
<p>ゲーム発表会 管理システム</p>
</div>

<div class="header-actions">

<span id="connectionStatus">
接続確認中
</span>

<button id="fullscreenButton">
全画面表示
</button>

<button id="logoutButton">
ログアウト
</button>

</div>

</header>

<main class="admin-layout">

<section class="qr-panel">

<div class="panel-title">
受付QRコード
</div>

<div id="receptionStatus" class="status-badge">
受付停止中
</div>

<h2 id="qrPlayer">
PLAYER ---
</h2>

<div class="qr-box">

<div id="qrcode"></div>

<div id="qrPlaceholder">
受付を開始してください
</div>

</div>

<div class="qr-timer">

QRコード残り有効時間

<strong id="qrRemaining">
--:--
</strong>

</div>

<p class="qr-description">
QRコードは先着1人限定です。<br>
認証後、自動的に次のQRコードへ切り替わります。
</p>

</section>

<section class="control-panel">

<div class="panel-title">
受付設定
</div>

<label for="endTime">
昼休み終了時刻（日本時間）
</label>

<input
type="time"
id="endTime"
value="13:10"
>

<div class="button-row">

<button id="startButton" class="primary-button">
受付開始
</button>

<button id="stopButton" class="danger-button">
受付終了
</button>

</div>

<div class="info-box">

<div>
受付状態：
<strong id="statusText">停止中</strong>
</div>

<div>
現在プレイ中：
<strong id="playingCount">0</strong> 人
</div>

<div>
終了時刻：
<strong id="deadlineText">未設定</strong>
</div>

</div>

<a
href="/admin/game"
target="_blank"
rel="noopener noreferrer"
class="admin-game-button"
>
管理者としてゲームを開く
</a>

</section>

<section class="players-panel">

<div class="players-header">

<h2>プレイヤー管理</h2>

<button
id="revokeAllButton"
class="danger-button"
>
全員停止
</button>

</div>

<div id="playersList">

<p class="empty-message">
プレイヤーはいません
</p>

</div>

</section>

</main>

</body>
</html>
