<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>科学技術部 ゲーム認証</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="center-body">

<div class="message-card">

<h1>科学技術部</h1>

<h2>ゲーム認証</h2>

<div id="loadingSpinner" class="spinner"></div>

<h3 id="loadingTitle">
認証しています...
</h3>

<p id="loadingMessage">
しばらくお待ちください。
</p>

</div>

<script>
const claimKey = {{ key | tojson }};
const claimPlayer = {{ player_id | tojson }};

async function authenticate() {

    // 認証キーをブラウザのアドレスバーから削除する。
    history.replaceState(null, "", "/play");

    try {

        const response = await fetch("/api/player/claim", {
            method: "POST",

            credentials: "same-origin",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                key: claimKey,
                player: claimPlayer
            })
        });

        const data = await response.json();

        if (data.ok) {
            location.replace(data.redirect);
            return;
        }

        document.getElementById("loadingSpinner").remove();

        document.getElementById("loadingTitle").textContent =
            "認証できませんでした";

        let message = "新しいQRコードを読み込んでください。";

        if (data.error === "used") {
            message =
                "このQRコードは使用済みです。\n\n" +
                "受付PCに表示されている\n" +
                "新しいQRコードを読み込んでください。";
        }

        if (data.error === "expired") {
            message = "QRコードの有効期限が切れました。";
        }

        if (data.error === "reception_closed") {
            message = "現在、受付を停止しています。";
        }

        document.getElementById("loadingMessage").textContent =
            message;

    } catch (error) {

        document.getElementById("loadingTitle").textContent =
            "通信エラー";

        document.getElementById("loadingMessage").textContent =
            "通信状況を確認してください。";
    }
}

authenticate();
</script>

</body>
</html>
