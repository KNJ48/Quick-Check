<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
科学技術部 スタッフログイン
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>

</head>

<body class="login-body">

<div class="login-card">

    <h1>
        科学技術部
    </h1>

    <h2>
        ゲーム発表会
    </h2>

    <p>
        スタッフログイン
    </p>

    <p>
        管理者または受付担当のパスワードを入力してください。
    </p>

    {% if error %}

    <div class="error-message">
        {{ error }}
    </div>

    {% endif %}

    <form
        method="POST"
        action="/admin/login"
    >

        <input
            type="password"
            name="password"
            placeholder="スタッフパスワード"
            required
            autocomplete="current-password"
        >

        <button type="submit">
            ログイン
        </button>

    </form>

</div>

</body>
</html>
