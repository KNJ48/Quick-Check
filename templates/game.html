<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>科学技術部 ゲーム</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<script>
window.GAME_CONFIG = {
    playerId: {{ player_id | tojson }},
    adminMode: {{ admin_mode | tojson }},
    gameUrl: {{ game_url | tojson }}
};
</script>

<script
src="{{ url_for('static', filename='js/game.js') }}"
defer>
</script>

</head>

<body class="game-body">

<div id="gameContainer"></div>

<div id="gameHud">

<span id="playerLabel">
PLAYER {{ player_id }}
</span>

<span id="remainingTime">
{% if admin_mode %}
時間制限なし
{% else %}
確認中...
{% endif %}
</span>

</div>

<div id="gameOverlay" class="game-overlay hidden">

<div class="message-card">

<h1 id="overlayTitle">
公開時間は終了しました。
</h1>

<p id="overlayMessage">
遊んでくれてありがとう！
</p>

<h2>科学技術部</h2>

</div>

</div>

</body>
</html>
