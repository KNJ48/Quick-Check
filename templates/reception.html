<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
科学技術部 ゲーム受付
</title>

<meta
    name="csrf-token"
    content="{{ csrf }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    defer
></script>

<script
    src="{{ url_for('static', filename='js/reception.js') }}"
    defer
></script>

<style>
/* このstyleはCSPによりブロックされるため、
   実際の装飾は既存CSSとJS側のclassで対応する */
</style>

</head>

<body class="reception-body">

<div class="reception-screen">

    <div class="reception-heading">

        <h1>
            科学技術部
        </h1>

        <p>
            ゲーム発表会
        </p>

    </div>

    <div class="reception-player">

        <span id="receptionPlayer">
            PLAYER ---
        </span>

    </div>

    <div class="reception-qr-area">

        <div id="receptionQr"></div>

        <div id="receptionPlaceholder">
            管理者が受付を開始するまでお待ちください
        </div>

    </div>

    <div class="reception-instruction">

        スキャンしてゲーム開始！

    </div>

    <div class="reception-timer">

        QRコード有効期限

        <strong id="receptionRemaining">
            --:--
        </strong>

    </div>

    <div class="reception-footer">

        <span id="receptionStatus">
            接続確認中...
        </span>

        <button
            id="receptionFullscreen"
            type="button"
        >
            全画面表示
        </button>

        <button
            id="receptionLogout"
            type="button"
        >
            ログアウト
        </button>

    </div>

</div>

</body>
</html>
